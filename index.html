<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SyncCheck - 2カメのズレを測る</title>
<meta name="description" content="2台のカメラで撮った同じ場面の音のズレを測る。動画は端末から出ない。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="theme-color" content="#12141a">
<!-- iPad でホーム画面に追加したとき、Safari の枠なしで開く -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SyncCheck">
<style>
  :root {
    --bg: #12141a;
    --panel: #1b1e26;
    --panel2: #22262f;
    --line: #333844;
    --fg: #e8eaf0;
    --dim: #9aa1b0;
    --accent: #5aa9e6;
    --ok: #4ec98a;
    --warn: #e6b45a;
    --bad: #e6685a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 15px;
    line-height: 1.7;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 20px 80px; }

  h1 { font-size: 22px; margin: 0 0 4px; }
  h1 .sub { font-size: 14px; color: var(--dim); font-weight: normal; margin-left: 10px; }
  h2 { font-size: 17px; margin: 32px 0 12px; padding-bottom: 6px;
       border-bottom: 1px solid var(--line); }

  .note {
    background: var(--panel);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    margin: 16px 0;
    font-size: 14px;
    color: var(--dim);
    border-radius: 0 4px 4px 0;
  }
  .note strong { color: var(--fg); }

  .drop {
    border: 2px dashed var(--line);
    border-radius: 8px;
    padding: 28px 20px;
    text-align: center;
    background: var(--panel);
    transition: border-color .15s, background .15s;
    cursor: pointer;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--panel2); }
  .drop .big { font-size: 16px; margin-bottom: 4px; }
  .drop .hint { font-size: 13px; color: var(--dim); }

  .groups { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
  @media (max-width: 720px) { .groups { grid-template-columns: 1fr; } }

  .group h3 { font-size: 15px; margin: 0 0 8px; }
  .group h3 .tag {
    font-size: 12px; color: var(--dim); font-weight: normal; margin-left: 6px;
  }

  .filelist { list-style: none; padding: 0; margin: 10px 0 0; }
  .filelist li {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .filelist .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filelist .meta { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .filelist .del {
    background: none; border: none; color: var(--dim); cursor: pointer;
    font-size: 16px; padding: 0 4px; line-height: 1;
  }
  .filelist .del:hover { color: var(--bad); }
  .filelist .noaudio { color: var(--bad); }

  button.primary {
    background: var(--accent); color: #07131d; border: none;
    padding: 11px 24px; border-radius: 5px; font-size: 15px;
    font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { background: var(--line); color: var(--dim); cursor: not-allowed; }
  button.ghost {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    padding: 8px 16px; border-radius: 5px; font-size: 14px; cursor: pointer;
  }
  button.ghost:hover:not(:disabled) { border-color: var(--accent); }
  button.ghost:disabled { color: var(--dim); cursor: not-allowed; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }

  #log {
    background: #0d0f13; border: 1px solid var(--line); border-radius: 5px;
    padding: 10px 12px; font-family: Consolas, "Courier New", monospace;
    font-size: 12px; color: var(--dim); max-height: 160px; overflow-y: auto;
    white-space: pre-wrap; margin-top: 12px; display: none;
  }
  #log.on { display: block; }

  .pair {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 16px; margin-bottom: 14px;
  }
  .pair .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .pair .names { font-weight: 600; font-size: 15px; }
  .pair .big {
    font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--accent); margin-left: auto;
  }
  .pair.bad .big { color: var(--bad); }
  .pair .expl { font-size: 13px; color: var(--dim); margin-top: 2px; }

  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px;
        font-size: 13px; margin-top: 12px; }
  .kv dt { color: var(--dim); }
  .kv dd { margin: 0; font-variant-numeric: tabular-nums; }

  .flag {
    display: inline-block; font-size: 12px; padding: 2px 8px;
    border-radius: 3px; margin-top: 10px; margin-right: 6px;
  }
  .flag.warn { background: #3a2f18; color: var(--warn); border: 1px solid #5a4620; }
  .flag.bad  { background: #3a1e1a; color: var(--bad);  border: 1px solid #5a2a24; }
  .flag.ok   { background: #16301f; color: var(--ok);   border: 1px solid #23492f; }

  table.win { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
  table.win th, table.win td {
    text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  table.win th { color: var(--dim); font-weight: normal; }
  table.win td.off { font-weight: 600; }
  table.win tr.out td { color: var(--bad); }

  .bar { height: 5px; background: var(--panel2); border-radius: 3px;
         overflow: hidden; margin-top: 12px; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }

  .warnbox {
    background: #2a2015; border: 1px solid #5a4620; border-radius: 5px;
    padding: 12px 16px; margin: 16px 0; font-size: 14px;
  }
  .warnbox ul { margin: 6px 0 0; padding-left: 20px; }
  .warnbox li { color: var(--warn); }

  .empty { color: var(--dim); font-size: 13px; padding: 10px 0; }
  select, input[type=number] {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 4px; padding: 6px 8px; font-size: 14px;
  }
  label.inline { font-size: 13px; color: var(--dim); display: flex;
                 align-items: center; gap: 6px; }
  .hidden { display: none !important; }
  /* いま動いている版。古いキャッシュが残っていないか目で見て分かるように
     （符号バグを直しても端末に届かない事故があったため） */
  /* 置き場所の表（これが答えの本体） */
  .place { margin: 10px 0 6px; border: 1px solid var(--line);
           border-radius: 6px; overflow: hidden; }
  .prow { display: flex; align-items: center; gap: 10px;
          padding: 8px 12px; background: var(--panel2); }
  .prow + .prow { border-top: 1px solid var(--line); }
  .pn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; font-size: 13px; color: var(--dim); }
  .ptc { font-family: Consolas, "Courier New", monospace; font-size: 20px;
         color: var(--fg); letter-spacing: 0.5px; }
  .pf { font-size: 12px; color: var(--dim); min-width: 84px; text-align: right; }
  /* どうやって位置を決めたか（音で測ったか、撮影時刻のままか） */
  .how { font-size: 11px; color: var(--ok); border: 1px solid var(--line);
         border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
  .how.dim2 { color: var(--warn); }
  .how.base { color: var(--dim); }
  .diag { margin-top: 4px; font-size: 11px; color: var(--dim);
          white-space: normal; }
  .diag summary { cursor: pointer; color: var(--accent); }
  .diag div { padding-left: 8px; }
  .rowwarn { display: block; font-size: 11px; color: var(--warn);
             margin-top: 2px; white-space: normal; }
  /* 1本だけ広い画面でないと窮屈なので、狭いときは縦に積む */
  @media (max-width: 560px) {
    .prow { flex-wrap: wrap; }
    .pn { flex: 1 1 100%; }
    .ptc { font-size: 18px; }
  }

  /* 結果カードの補助表示 */
  .expl .sub2 { color: var(--dim); font-weight: normal; margin-left: 6px;
                font-size: 13px; }
  .rem { font-size: 12px; color: var(--warn); margin-top: 4px; }
  .hint { font-size: 12px; color: var(--dim); }
  h1 .ver { font-size: 12px; color: var(--dim); font-weight: normal;
            margin-left: 8px; border: 1px solid var(--line);
            border-radius: 10px; padding: 1px 8px; vertical-align: middle; }
</style>
</head>
<body>
<div class="wrap">

  <h1>SyncCheck<span class="sub">クリップを置く位置を出す</span>
      <span class="ver" id="ver" title="いま動いている版">v12</span></h1>

  <div class="note">
    <strong>動画はこの端末から出ません。</strong>
    ブラウザの中で音声だけを読んで計算します。アップロードは発生しません。<br>
    何本でもまとめて放り込めます。<strong>いちばん早い1本を 00:00:00:00
    として、それぞれをどこに置くか</strong>を出します。
  </div>

  <h2>1. 動画を放り込む</h2>

  <div class="drop" id="drop">
    <div class="big">ここにまとめてドロップ</div>
    <div class="hint">クリックしても選べます。2本でも6本でもまとめてどうぞ</div>
    <input type="file" id="file" multiple accept="video/*,audio/*" class="hidden">
  </div>
  <ul class="filelist" id="list"></ul>

  <h2>2. 測る</h2>

  <div class="row">
    <button class="primary" id="run" disabled>置く位置を出す</button>
    <button class="ghost" id="clear">全部消す</button>
    <label class="inline">
      測る長さ
      <select id="mlen">
        <option value="60">60秒（速い）</option>
        <option value="180" selected>180秒（おすすめ）</option>
        <option value="300">300秒（念入り）</option>
      </select>
    </label>
    <label class="inline">
      <input type="checkbox" id="showlog"> 経過を表示
    </label>
    <label class="inline" title="不具合を追うときだけ。何百行も出ます">
      <input type="checkbox" id="ffmpeglog"> ffmpeg の詳細も出す
    </label>
  </div>

  <div class="row">
    <label class="inline">
      フレームレート
      <select id="fps">
        <option value="30" selected>30</option>
        <option value="29.97">29.97</option>
        <option value="25">25</option>
        <option value="24">24</option>
        <option value="23.98">23.98</option>
        <option value="50">50</option>
        <option value="60">60</option>
        <option value="59.94">59.94</option>
      </select>
    </label>
    <span class="hint" id="fpsHint">素材から自動で読みます</span>
  </div>

  <div class="bar" id="bar" style="display:none"><i></i></div>
  <div id="log"></div>

  <div id="results"></div>

  <div id="exportRow" class="row hidden">
    <button class="ghost" id="expTxt">結果をテキストで保存</button>
    <button class="ghost" id="expCsv">CSV で保存</button>
    <label class="inline" title="編集ソフトに読ませて自動で並べる">
      <input type="checkbox" id="wantFcp"> fcpxml も出す
    </label>
    <button class="ghost hidden" id="expFcp">fcpxml で保存</button>
    <span class="hint">タイムコードは上のフレームレートで計算します</span>
  </div>

</div>

<script type="module">
import { lineUp } from './src/lineup.js';
import { readDurationQuick, readMeta, loadFFmpeg, setLogging } from './src/audio.js';
import { buildLineupText, buildLineupCSV, buildLineupFCPXML, saveText,
         fmtClock, toFrames, framesToTimecode } from './src/export.js';

// 放り込んだ動画（A側/B側の区別は持たない）
let clips = [];
// フレームレートを変えたとき、測り直さず描き直すために持っておく
let lastLine = null;

const $ = (id) => document.getElementById(id);

function log(msg) {
  const el = $('log');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

/**
 * 進捗バーを動かす。0〜1 で指定する。
 *
 * ■ 2026-09-19: 作り替えのときにこの関数ごと消してしまい、
 * ボタンを押しても「setBar is not defined」で最初の一歩で
 * 止まっていた。ログも進捗も出ないので、利用者からは
 * 「押しても何も起きない」としか見えなかった。
 */
function setBar(ratio) {
  const el = $('bar').querySelector('i');
  if (el) el.style.width = `${Math.max(0, Math.min(1, ratio)) * 100}%`;
}

/** 失敗したことを結果欄に出す。 */
function showError(msg) {
  $('results').innerHTML =
    `<div class="pair bad"><div class="expl">${msg}</div></div>`;
}

$('showlog').onchange = (e) => $('log').classList.toggle('on', e.target.checked);
// ffmpeg の生ログは既定で出さない（何百行も出て読めなくなる）。
// 「ffmpeg の詳細も出す」を入れたときだけ流す。
$('ffmpeglog').onchange = (e) => {
  setLogging(e.target.checked);
  if (e.target.checked) {
    $('showlog').checked = true;
    $('log').classList.add('on');
  }
};

// --- ファイルの受け取り ---------------------------------------------------

{
  const drop = $('drop');
  const input = $('file');

  drop.onclick = () => input.click();
  input.onchange = () => { addFiles([...input.files]); input.value = ''; };

  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => {
    e.preventDefault();
    drop.classList.remove('over');
    addFiles([...e.dataTransfer.files]);
  };
}

async function addFiles(files) {
  for (const file of files) {
    if (clips.some((f) => f.name === file.name)) continue;

    // まず速い方法で長さだけ読んで、すぐ一覧に出す
    const duration = await readDurationQuick(file);
    clips.push({
      name: file.name, file, duration,
      lastModified: file.lastModified,
      creationMs: null, hasAudio: null, fps: null, probed: false,
    });
    render();
  }
}

function render() {
  const ul = $('list');
  ul.innerHTML = '';
  if (clips.length === 0) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = 'まだありません';
    ul.appendChild(li);
  } else {
    for (const f of clips) {
      const li = document.createElement('li');
      const audioWarn = f.hasAudio === false
        ? '<span class="noaudio">音声なし</span>' : '';
      li.innerHTML =
        `<span class="nm" title="${f.name}">${f.name}</span>`
        + `<span class="meta">${f.duration ? fmtClock(f.duration) : '長さ不明'}`
        + `${f.creationMs ? ' / 撮影時刻あり' : ''} ${audioWarn}</span>`;
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.title = 'この素材を外す';
      del.onclick = () => {
        clips = clips.filter((x) => x.name !== f.name);
        render();
      };
      li.appendChild(del);
      ul.appendChild(li);
    }
  }
  // 1本でも位置は出る（必ず 0 になる）が、意味があるのは2本から
  $('run').disabled = clips.length < 2;
}

$('clear').onclick = () => {
  clips = [];
  lastLine = null;
  $('results').innerHTML = '';
  $('exportRow').classList.add('hidden');
  $('log').textContent = '';
  render();
};

// --- 測る -----------------------------------------------------------------

$('run').onclick = async () => {
  const btn = $('run');
  btn.disabled = true;
  $('results').innerHTML = '';
  $('exportRow').classList.add('hidden');
  $('bar').style.display = 'block';
  setBar(0);

  try {
    log('FFmpeg を準備しています（初回は数十MBの読み込みがあります）');
    await loadFFmpeg((p) => { if (p.type === 'log') log('  ' + p.message); });

    // 撮影時刻と長さを読む。ここで初めて ffmpeg を通す。
    log('素材を調べています');
    let n = 0;
    for (const f of clips) {
      if (!f.probed) {
        try {
          const m = await readMeta(f.file);
          f.creationMs = m.creationMs;
          f.hasAudio = m.hasAudio;
          f.fps = m.fps;
          if (m.duration > 0) f.duration = m.duration;
        } catch (err) {
          log(`  ${f.name}: 読めませんでした（${err.message}）`);
        }
        f.probed = true;
      }
      setBar((++n / clips.length) * 0.25);
      log(`  ${f.name}: ${f.duration ? fmtClock(f.duration) : '長さ不明'}`
          + `${f.creationMs ? ' / 撮影時刻あり' : ' / 撮影時刻なし'}`
          + `${f.fps ? ' / ' + f.fps + 'fps' : ''}`
          + `${f.hasAudio === false ? ' / 音声なし' : ''}`);
    }
    applyDetectedFps();
    render();

    const noAudio = clips.filter((f) => f.hasAudio === false);
    if (noAudio.length > 0) {
      log(`※ 音声が無い素材があります: ${noAudio.map((f) => f.name).join(', ')}`);
    }

    log('');
    log('音で位置を測っています');
    const mlen = Number($('mlen').value);
    const line = await lineUp(clips, (p) => {
      if (p.total > 0) setBar(0.25 + (p.done / p.total) * 0.75);
      if (p.message) log('  ' + p.message);
    }, mlen, Number($('fps').value));

    lastLine = line;
    showLineup(line);
    $('exportRow').classList.remove('hidden');
    setBar(1);
  } catch (err) {
    showError('測定中にエラーが起きました: ' + err.message);
  } finally {
    btn.disabled = false;
    setTimeout(() => { $('bar').style.display = 'none'; }, 600);
  }
};

/**
 * 素材から読めたフレームレートを選択欄に反映する。
 *
 * 素材ごとに違うことがある（別のカメラなので当然ありうる）。
 * そのときはいちばん多い値を採り、画面に断りを出す。
 * 勝手に決めて黙っていると、フレーム数が1つずれても気づけない。
 */
function applyDetectedFps() {
  const hint = $('fpsHint');
  const found = clips.filter((f) => f.fps).map((f) => f.fps);
  if (found.length === 0) {
    hint.textContent = '素材から読めなかったので手で選んでください';
    return;
  }

  const opts = [...$('fps').options].map((o) => Number(o.value));
  const nearest = (v) => opts.reduce((best, o) =>
    Math.abs(o - v) < Math.abs(best - v) ? o : best, opts[0]);

  // いちばん多い値を採る
  const counts = new Map();
  for (const v of found.map(nearest)) {
    counts.set(v, (counts.get(v) || 0) + 1);
  }
  let pick = opts[0];
  let max = -1;
  for (const [v, c] of counts) { if (c > max) { max = c; pick = v; } }
  $('fps').value = String(pick);

  if (counts.size > 1) {
    hint.textContent = `素材ごとに違います（${[...counts.keys()].join(' / ')}）`
      + `。いちばん多い ${pick} を使います`;
  } else {
    hint.textContent = `素材から読みました（${pick}fps）`;
  }
}

/**
 * 並べた結果を出す。
 *
 * これがこのアプリの答え。タイムラインに打ち込む位置をそのまま出す。
 */
function showLineup(line) {
  const box = $('results');
  box.innerHTML = '';
  const fps = Number($('fps').value);
  const { items, notes } = line;

  if (items.length === 0) {
    box.innerHTML = '<div class="pair bad"><div class="expl">'
      + '並べられませんでした</div></div>';
    return;
  }

  const h = document.createElement('h2');
  h.textContent = '3. この位置に置く';
  box.appendChild(h);

  const card = document.createElement('div');
  card.className = 'pair';

  let rows = '';
  for (const it of items) {
    const fr = toFrames(it.startSec, fps);
    const tc = framesToTimecode(fr, fps);
    const warn = it.warn ? `<div class="rowwarn">${it.warn}</div>` : '';
    // 基準／音で測った／測れず撮影時刻のまま、の3つを区別する。
    // 基準を「撮影時刻」と出すと疑わしく見えてしまうため。
    // 基準 / 音で測った / 他と重ならなかった の3つを区別する。
    // 1カメだけの場面は「重ならない」のが正常なので、
    // 異常のように見せない（黄色にはするが警告文は出さない）。
    const how = it.isBase
      ? '<span class="how base">基準</span>'
      : (it.measured
        ? `<span class="how" title="相関スコア ${it.score.toFixed(3)}">音で測定</span>`
        : '<span class="how dim2" title="他と重ならなかった'
          + '（1カメだけの場面など）">単独</span>');
    // 診断: ずれたときに原因を切り分けられるよう、内訳を出す。
    // どの相手とどれだけ重なり、窓がいくつ一致したかが分かる。
    let diag = '';
    if (it.detail) {
      const d = it.detail;
      diag =
        `<details class="diag"><summary>内訳</summary>`
        + `<div>合わせた相手: ${d.against}</div>`
        + `<div>その相手からのズレ: ${d.offsetSec.toFixed(2)}秒</div>`
        + `<div>重なり: ${d.overlapSec.toFixed(0)}秒</div>`
        + `<div>窓の一致: ${d.agree}/${d.windows}`
        + `（全部そろっているほど確か）</div>`
        + `<div>相関スコア: ${d.score.toFixed(3)}</div>`
        + `</details>`;
    }
    rows +=
      `<div class="prow">`
      + `<span class="pn" title="${it.name}">${it.name}${warn}${diag}</span>`
      + `${how}`
      + `<span class="ptc">${tc}</span>`
      + `<span class="pf">${fr} フレーム</span>`
      + `</div>`;
  }

  card.innerHTML =
    `<div class="place">${rows}</div>`
    + `<div class="expl">いちばん早い1本を 00:00:00:00 として、`
    + `それぞれをこの位置に置くと合います`
    + `<span class="sub2">（${fps}fps）</span></div>`
    + (notes.length
      ? `<div class="rem">${notes.map((x) => '・' + x).join('<br>')}</div>`
      : '');

  box.appendChild(card);
}

// --- 書き出し -------------------------------------------------------------

function stamp() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`
       + `_${p(d.getHours())}${p(d.getMinutes())}`;
}

$('expTxt').onclick = () => {
  if (!lastLine) return;
  saveText(`SyncCheck_${stamp()}.txt`,
    buildLineupText(lastLine, Number($('fps').value)), 'text/plain');
};

$('expCsv').onclick = () => {
  if (!lastLine) return;
  saveText(`SyncCheck_${stamp()}.csv`,
    buildLineupCSV(lastLine, Number($('fps').value)), 'text/csv');
};

/*
 * fcpxml を出すかどうか。既定はオフ。
 *
 * 編集ソフトを使わない人には要らないボタンなので、既定では隠す。
 * 選択は localStorage に覚えるので、一度入れれば次からそのまま。
 */
const FCP_KEY = 'synccheck.wantFcp';
function applyFcpOption() {
  const on = $('wantFcp').checked;
  $('expFcp').classList.toggle('hidden', !on);
  try { localStorage.setItem(FCP_KEY, on ? '1' : '0'); } catch (_) { /* 無視 */ }
}
try {
  $('wantFcp').checked = localStorage.getItem(FCP_KEY) === '1';
} catch (_) { /* プライベートモードなどで使えないことがある */ }
$('wantFcp').onchange = applyFcpOption;
applyFcpOption();

$('expFcp').onclick = () => {
  if (!lastLine) return;
  try {
    const xml = buildLineupFCPXML(lastLine, { fps: Number($('fps').value) });
    saveText(`SyncCheck_${stamp()}.fcpxml`, xml, 'application/xml');
  } catch (err) {
    alert('書き出せませんでした: ' + err.message);
  }
};

// フレームレートを変えたら、測り直さずに表示だけ作り直す。
// 位置は秒で持っているので、換算をやり直すだけでよい。
$('fps').onchange = () => {
  if (lastLine) showLineup(lastLine);
};

render();

/*
 * オフライン用の登録。
 *
 * 出先で使うのが前提なので、一度開いたら圏外でも起動できるようにする。
 * 登録に失敗してもアプリ自体は動くので、握りつぶして先に進む
 * （file:// で開いたときや、古い Safari では登録できない）。
 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      // 新しい版が出ていないか毎回確かめる。
      // 放っておくとブラウザ任せになり、直したものが端末に届かない。
      reg.update().catch(() => {});
      // 新しい Service Worker が待機に入ったら、次に開いたとき
      // 確実に入れ替わるよう促す。
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) {
            log('新しい版が届きました。開き直すと切り替わります');
          }
        });
      });
    } catch (_) { /* 登録できなくてもアプリは動く */ }
  });
}
</script>
