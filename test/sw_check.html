<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>SW チェック</title></head>
<body>
<pre id="out">確認中...</pre>
<script>
/*
 * Service Worker が本当にキャッシュを作るかを確かめる。
 *
 * 画面を見なくても分かるよう、結果を serve.py の /__test_result へ送る
 * （ヘッドレスで動かすため）。ブラウザで直接開いても結果は画面に出る。
 */
const lines = [];
const say = (s) => { lines.push(s); out.textContent = lines.join('\n'); };

async function main() {
  if (!('serviceWorker' in navigator)) throw new Error('SW 非対応');

  // 前回の残りを消してから測る
  for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
  for (const k of await caches.keys()) await caches.delete(k);
  say('前回の登録とキャッシュを消した');

  const reg = await navigator.serviceWorker.register('../sw.js', { scope: '../' });
  say('register() 成功  scope=' + reg.scope);

  await navigator.serviceWorker.ready;
  say('activate 完了');

  // install で 31MB 取りに行くので、終わるまで待つ
  const deadline = Date.now() + 180000;
  let names = [];
  while (Date.now() < deadline) {
    names = await caches.keys();
    if (names.length) {
      const c = await caches.open(names[0]);
      if ((await c.keys()).length >= 20) break;
    }
    await new Promise((r) => setTimeout(r, 1000));
  }

  const cache = await caches.open(names[0]);
  const keys = await cache.keys();
  say('キャッシュ名: ' + names[0]);
  say('入った数: ' + keys.length + ' 件');

  // 本体の wasm が丸ごと入っているか（ここが欠けるとオフラインで動かない）
  const wasm = await cache.match('../vendor/core/ffmpeg-core.wasm');
  if (!wasm) throw new Error('wasm がキャッシュに入っていない');
  const size = (await wasm.blob()).size;
  say('wasm: ' + size.toLocaleString() + ' bytes');
  if (size < 30000000) throw new Error('wasm が途中で切れている');

  // index.html も入っているか（圏外で起動する入口）
  if (!await cache.match('../index.html')) throw new Error('index.html が無い');
  say('index.html: あり');

  say('RESULT: PASS');
}

main().catch((e) => say('RESULT: FAIL  ' + e.message)).finally(() => {
  fetch('/__test_result', { method: 'POST', body: lines.join('\n') }).catch(() => {});
});
</script>
</body>
</html>
